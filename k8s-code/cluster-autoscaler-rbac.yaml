apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources:
      - events
      - endpoints
    verbs: ["create", "patch"]

  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]

  - apiGroups: [""]
    resources:
      - pods/status
    verbs: ["update"]

  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch", "update"]

  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - replicasets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csinodes
      - csidrivers
      - csistoragecapacities
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["list", "watch"]

  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["create"]

  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    resourceNames:
      - cluster-autoscaler
    verbs: ["get", "update"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - volumeattachments
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["resource.k8s.io"]
    resources:
      - resourceclaims
      - resourceslices
      - deviceclasses
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler

subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system

rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - create
      - list
      - watch

  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - cluster-autoscaler-status
      - cluster-autoscaler-priority-expander
    verbs:
      - get
      - update
      - delete
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system

subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler