apiVersion: apps/v1
kind: Deployment

metadata:
  name: cluster-autoscaler
  namespace: kube-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cluster-autoscaler

  template:
    metadata:
      labels:
        app: cluster-autoscaler

    spec:
      serviceAccountName: cluster-autoscaler

      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.35.0

          command:
            - ./cluster-autoscaler
            - --cloud-provider=aws
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/cc-adtest
            - --expander=least-waste
            - --skip-nodes-with-local-storage=false
            - --v=4

          env:
            - name: AWS_REGION
              value: us-east-1

          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 300Mi